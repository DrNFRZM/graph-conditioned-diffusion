# CPU-friendly quick mode. One configuration is shared across methods; its
# post-dry-run adjustment and exploratory status are disclosed in docs/research_note.md.
name: quick
device: auto            # cpu | cuda | auto
seeds: [1000, 1001, 1002]  # each seed = new stratified node split + new initialisation
data:
  root: data
  like_threshold: 4     # rating >= 4 -> "likes" edge, otherwise "dislikes"
  split: [0.60, 0.15, 0.25]   # train / val / test users
  knn_k: 10             # k for the user-user kNN graph ablation
diffusion:
  T: 100
  width: 128
  depth: 3
  t_dim: 64
  cond_dim: 32          # identical for flat and GNN conditioning
  dropout: 0.1
  clip_x0: 4.0
gnn:
  hidden: 32
  layers: 2
  dropout: 0.2
train:
  epochs: 300
  batch_size: 64
  lr: 0.001
  weight_decay: 0.0001
  eval_every: 5
  patience: 12
eval:
  n_samples_per_node: 32
  knn_eval_k: 10
methods:
  - marginal_bootstrap
  - row_bootstrap
  - diff_uncond
  - diff_flat
  - diff_gnn
  - diff_gnn_shuffled
  - diff_gnn_knn
