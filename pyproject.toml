[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "graph-conditioned-diffusion"
version = "0.1.0"
description = "Small controlled study: does conditioning a mixed-type diffusion model on GNN embeddings of a user-item graph help?"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Farzam Nikbakhsh Jorshari", email = "nikbakhshfarzam@gmail.com" }]
dependencies = [
    "torch>=2.2",
    "torch_geometric>=2.5",
    "numpy>=1.26",
    "pandas>=2.1",
    "scikit-learn>=1.3",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
]

[project.urls]
Repository = "https://github.com/DrNFRZM/graph-conditioned-diffusion"
Issues = "https://github.com/DrNFRZM/graph-conditioned-diffusion/issues"

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
gcdiff = "gcdiff.run:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
